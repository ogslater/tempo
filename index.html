<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Igor Guterres - Clima</title>
    <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <div class="container">
        <div class="left-info">
            <div class="pic-gradient"></div>
            <div class="today-info">
                <h2>Dia</h2>
                <span>Data</span>
                <div>
                    <i class="bx bx-current-location"></i>
                    <span>Cidade, País</span>
                </div>
            </div>
            <div class="today-weather">
                <i class="bx bx-sun"></i>
                <h1 class="weather-temp">--°C</h1>
                <h3>Condição</h3>
            </div>
        </div>

        <div class="right-info">
            <div class="day-info">
                <div>
                    <span class="title">Precipitação</span>
                    <span class="value">--%</span>
                </div>
                <div>
                    <span class="title">Umidade</span>
                    <span class="value">--%</span>
                </div>
                <div>
                    <span class="title">Vento</span>
                    <span class="value">-- km/h</span>
                </div>
            </div>

            <ul class="days-list">
                
            </ul>

            <div class="btn-container">
                <button class="loc-button">Buscar Localização</button>
            </div>
        </div>
    </div>

    <script src="scripts/index.js" defer></script>
</body>

</html>
